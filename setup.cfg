[bumpversion]
current_version = 1.0.0
commit = True
tag = True

[bumpversion:file:setup.py]
search = version='{current_version}'
replace = version='{new_version}'

[bumpversion:file:faraday_agent_dispatcher/__init__.py]
search = __version__ = '{current_version}'
replace = __version__ = '{new_version}'

[bdist_wheel]
universal = 1

[flake8]
exclude = docs,offensive_checks/bagre_pkg
# E203 (whitespace before ':') is PEP-8 ambiguous; black formats slices in a
# way that triggers it. W503 (line break before binary op) is also black-preferred.
extend-ignore = E203, W503

[aliases]
# Define setup.py command aliases here
test = pytest

[tool:pytest]
collect_ignore = ['setup.py']

