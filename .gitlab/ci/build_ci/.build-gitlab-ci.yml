.docker-build-base:
  stage: build
  variables:
    # docker/publish/Dockerfile uses BuildKit heredoc syntax (RUN python - <<'PY')
    # introduced in 85fea30. The shell runner's classic builder rejects it with
    # "unknown instruction: IMPORT"; enabling BuildKit makes the heredoc parse.
    DOCKER_BUILDKIT: "1"
  script:
    - echo "Building image with tag $IMAGE_TAG and base image ${BASE_IMAGE:-$BASE_IMAGE_TAG}"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker build -f docker/publish/Dockerfile --tag $CI_REGISTRY/faradaysec/cloud/faraday_agent_dispatcher:$IMAGE_TAG --build-arg TAG=$BASE_IMAGE_TAG ${BASE_IMAGE:+--build-arg BASE_IMAGE=$BASE_IMAGE} .
    - docker push $CI_REGISTRY/faradaysec/cloud/faraday_agent_dispatcher:$IMAGE_TAG
  tags:
    - shell
  rules:
    - when: never

docker-build-branch:
  extends: .docker-build-base
  variables:
    IMAGE_TAG: "$CI_COMMIT_BRANCH"
    BASE_IMAGE_TAG: "plugins-testing-$CI_COMMIT_BRANCH"
    # The branch plugins base (docker-integration-build-branch) currently fails:
    # systemd 260 uses openat2() which the CI runner sandbox rejects (EUNATCH).
    # Build the offensive-checks image straight off the published release image
    # instead (validated locally), so no plugins rebuild is required.
    BASE_IMAGE: "faradaysec/faraday_agent_dispatcher:3.9.1"
  rules:
    - !reference [.devel-branch-manual, rules]
    - when: never

docker-build-main:
  extends: .docker-build-base
  variables:
    IMAGE_TAG: "latest"
    BASE_IMAGE_TAG: "base-tag"
  rules:
    - !reference [.dev-staging-master-manual, rules]
    - !reference [.daily-control, rules]
    - when: never

docker-build-tag:
  extends: .docker-build-base
  variables:
    IMAGE_TAG: "latest"
    BASE_IMAGE_TAG: "base-tag"
  rules:
    - !reference [.on-release, rules]
    - when: never
