.docker-integration-build-base:
  stage: integration-build
  script:
    - echo "Building plugins-docker image with tag $IMAGE_TAG - ci tag $CI_COMMIT_TAG"
    - cd docker/plugins-docker
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker build --tag $CI_REGISTRY/faradaysec/cloud/faraday_agent_dispatcher:$IMAGE_TAG .
    - docker push $CI_REGISTRY/faradaysec/cloud/faraday_agent_dispatcher:$IMAGE_TAG
  tags:
    - shell
  rules:
    - when: never

docker-integration-build-branch:
  extends: .docker-integration-build-base
  variables:
    IMAGE_TAG: "plugins-testing-$CI_COMMIT_BRANCH"
  # Kali rolling/last-snapshot ships systemd 260.1-1, whose postinst calls
  # openat2() with RESOLVE_BENEATH on /etc/machine-id and the systemd catalog
  # dirs. The shell runner's kernel/seccomp returns EUNATCH on those syscalls,
  # so the apt-get install layer in docker/plugins-docker/Dockerfile always
  # dies during `Setting up systemd`. docker-build-branch already routes
  # around this via BASE_IMAGE=faradaysec/faraday_agent_dispatcher:3.9.1
  # (see .gitlab/ci/build_ci/.build-gitlab-ci.yml), so the integration-build
  # is not a release gate on branches — mark it allow_failure to keep the
  # branch pipeline honest until the runner sandbox supports openat2.
  allow_failure: true
  rules:
    - !reference [.devel-branch-manual, rules]
    - when: never

docker-integration-build-main:
  extends: .docker-integration-build-base
  variables:
    IMAGE_TAG: "base"
  rules:
    - !reference [.dev-staging-master-manual, rules]
    - !reference [.daily-control, rules]
    - when: never

docker-integration-build-tag:
  extends: .docker-integration-build-base
  variables:
    IMAGE_TAG: "base-tag"
  rules:
    - !reference [.on-release, rules]
    - when: never
