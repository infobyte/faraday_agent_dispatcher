# =============================================================================
# faraday-agent-dispatcher — .gitlab-ci.yml
# =============================================================================
# CHANGES: Added faraday-devsecops include, security_scan stage,
#          and security scan jobs. Uses MANAOS_* overrides (test vars conflict).
#          Uses group-level CI/CD variables for Faraday credentials.
# =============================================================================

variables:
    TZ: "America/New_York"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    APT_CACHE_DIR: "$CI_PROJECT_DIR/apt-cache"
    POSTGRES_DB: custom_db
    POSTGRES_USER: custom_user
    POSTGRES_PASSWORD: custom_pass
    # NOTE: These are TEST credentials for functional tests
    FARADAY_USER: custom_user
    FARADAY_PASSWORD: custom_pass
    FARADAY_EMAIL: test@test.com
    FARADAY_REF: white/dev
    EXECUTOR_DIR: ./basic_executor.py
    VAULT_AUTH_ROLE: 'python-sast-readonly'
    VAULT_SERVER_URL: 'https://tluav-lb.faradaysec.com'
    VAULT_AUTH_PATH: jwt
    TYPING_BRANCH: 'dev'

workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - when: always

cache:
  paths:
    - "$CI_PROJECT_DIR/.cache/pip"
    - "$CI_PROJECT_DIR/apt-cache"


before_script:
    - mkdir -pv $APT_CACHE_DIR

stages:
    - testing
    # - post_testing
    - integration-build
    - integration-test
    - security_scan        # NEW
    - build
    - publish
    - deploy

services:
    - postgres:latest

include:
  # --- Existing includes ---
  - local: docs/.gitlab-ci.yml
  - local: .gitlab/ci/.get-secrets.yml
  - local: .gitlab/ci/.rules-conditions.yml
  - local: .gitlab/ci/.pre-gitlab-ci.yml
  - local: .gitlab/ci/testing/.testing-gitlab-ci.yml
  #- local: .gitlab/ci/testing/.post-gitlab-ci.yml
  - local: .gitlab/ci/plugins-integration/.build-gitlab-ci.yml
  #- local: .gitlab/ci/plugins-integration/.testing-gitlab-ci.yml
  - local: .gitlab/ci/build_ci/.build-gitlab-ci.yml
  - local: .gitlab/ci/publish/.pypi-gitlab-ci.yml
  - local: .gitlab/ci/publish/.publish-dockerhub-gitlab-ci.yml

  # --- NEW: Faraday DevSecOps security scanning ---
  - project: 'faradaysec/faraday-devsecops'
    file: '/gitlab-ci/faraday-devsecops.yml'

# =============================================================================
# Security Scan Jobs
# =============================================================================

bandit:
  extends: .bandit-scan
  variables:
    FARADAY_URL: ${MANAOS_URL}
    FARADAY_USER: ${MANAOS_USER}
    FARADAY_PASSWORD: ${MANAOS_PASSWORD}

semgrep:
  extends: .semgrep-scan
  variables:
    FARADAY_URL: ${MANAOS_URL}
    FARADAY_USER: ${MANAOS_USER}
    FARADAY_PASSWORD: ${MANAOS_PASSWORD}

trivy-deps:
  extends: .trivy-fs-scan
  variables:
    FARADAY_URL: ${MANAOS_URL}
    FARADAY_USER: ${MANAOS_USER}
    FARADAY_PASSWORD: ${MANAOS_PASSWORD}

gitleaks:
  extends: .gitleaks-scan
  variables:
    FARADAY_URL: ${MANAOS_URL}
    FARADAY_USER: ${MANAOS_USER}
    FARADAY_PASSWORD: ${MANAOS_PASSWORD}

sonarcloud:
  extends: .sonarcloud-scan
  variables:
    SONAR_ORGANIZATION: "faradaysec"
    SONAR_PROJECT_KEY: "faradaysec_faraday-agent-dispatcher"
    FARADAY_URL: ${MANAOS_URL}
    FARADAY_USER: ${MANAOS_USER}
    FARADAY_PASSWORD: ${MANAOS_PASSWORD}

# ---------------------------------------------------------------------------
# Trigger documentation update on new release
# ---------------------------------------------------------------------------
trigger_doc_update:
  stage: publish
  trigger:
    project: faradaysec/faraday-docu-auto
    branch: main
    strategy: depend
  variables:
    REPO: faraday_agent_dispatcher_gitlab
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+/
